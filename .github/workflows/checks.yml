name: Calculator checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # frozen baseline validation reads historical Git blobs
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r src/requirements.txt -r tests/ci/requirements.txt
      - run: npm ci
      - run: python -m compileall src/scientific_calculator
      - run: python -m pip check
      - run: python -m pip_audit -r src/requirements.txt
      - run: npm audit --audit-level=high
      - run: node tests/ci/check-licenses.js
      - run: python -m unittest discover -s tests/django -v
      - run: python tests/ci/check-package.py
      - run: docker compose config
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d --wait
      - run: npm test
      - run: git diff --check
      - if: always()
        run: docker compose down
